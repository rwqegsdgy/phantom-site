<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101112" />
    <title>The_Phantom-_-</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        min-height: 100vh;
        min-height: 100svh;
        color: #f5f5f4;
        font:
          16px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        background:
          linear-gradient(rgba(5, 7, 9, 0.34), rgba(5, 7, 9, 0.53)),
          url("fon.jpg") center/cover fixed;
      }
      .cursor-glow {
        position: fixed;
        left: 0;
        top: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(245, 249, 255, 0.95);
        box-shadow:
          0 0 7px 2px rgba(225, 237, 255, 0.8),
          0 0 24px 8px rgba(194, 216, 255, 0.35),
          0 0 46px 15px rgba(165, 194, 255, 0.12);
        pointer-events: none;
        z-index: 20;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: opacity 0.25s ease;
      }
      @media (hover: none),
        (pointer: coarse),
        (prefers-reduced-motion: reduce) {
        .cursor-glow {
          display: none;
        }
      }
      .snow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .flake {
        position: absolute;
        top: -16px;
        left: var(--left);
        width: var(--size);
        height: var(--size);
        opacity: var(--opacity);
        animation: snowfall var(--duration) linear var(--delay) infinite;
        will-change: transform;
      }
      .flake::before {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #f5f9ff;
        box-shadow: 0 0 var(--glow) rgba(219, 236, 255, 0.65);
        filter: blur(var(--blur));
        animation: snow-sway var(--sway-duration) ease-in-out var(--delay) infinite alternate;
      }
      @keyframes snowfall {
        from { transform: translate3d(0, -12px, 0); }
        to { transform: translate3d(var(--drift), calc(100svh + 30px), 0); }
      }
      @keyframes snow-sway {
        from { transform: translateX(calc(var(--sway) * -1)) scale(.85); }
        to { transform: translateX(var(--sway)) scale(1.12); }
      }
      .click-spark {
        position: fixed;
        z-index: 30;
        left: var(--x);
        top: var(--y);
        width: 0;
        height: 0;
        pointer-events: none;
      }
      .click-spark::before {
        content: "";
        position: absolute;
        width: 38px;
        height: 38px;
        left: -19px;
        top: -19px;
        border: 1px solid rgba(222, 244, 255, .85);
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(156, 216, 255, .7), inset 0 0 9px rgba(204, 235, 255, .35);
        animation: frost-ring 760ms cubic-bezier(.15,.65,.25,1) forwards;
      }
      .click-spark::after {
        content: "";
        position: absolute;
        width: 42px;
        height: 42px;
        left: -21px;
        top: -21px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(179,225,255,.5) 15%, rgba(140,198,255,.16) 38%, transparent 70%);
        animation: frost-flash 700ms ease-out forwards;
      }
      .ice-particle {
        position: absolute;
        left: 0;
        top: 0;
        width: var(--size);
        height: var(--size);
        border-radius: var(--round);
        background: rgba(231, 248, 255, .95);
        box-shadow: 0 0 6px 1px rgba(155, 214, 255, .65);
        animation: ice-burst var(--life) cubic-bezier(.14,.65,.24,1) forwards;
      }
      @keyframes frost-ring {
        0% { opacity: .9; transform: scale(.18); }
        55% { opacity: .55; }
        100% { opacity: 0; transform: scale(2.15); }
      }
      @keyframes frost-flash {
        0% { opacity: .95; transform: scale(.25); }
        30% { opacity: .8; transform: scale(1.2); }
        100% { opacity: 0; transform: scale(1.6); }
      }
      @keyframes ice-burst {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(.35) rotate(0deg); }
        25% { opacity: .95; }
        100% { opacity: 0; transform: translate(calc(var(--dx) - 50%), calc(var(--dy) - 50%)) scale(.18) rotate(var(--spin)); }
      }
      main {
        overflow-x: clip;
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }
      .card {
        width: min(100%, 460px);
        padding: 40px 32px 32px;
        text-align: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 28px;
      }
      .card {
        position: relative;
        isolation: isolate;
        transform: perspective(1100px) rotateX(var(--tilt-x, 0deg))
          rotateY(var(--tilt-y, 0deg));
        transition: transform 0.18s ease-out;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: -32px;
        border-radius: 60px;
        pointer-events: none;
        z-index: -1;
        background: linear-gradient(
          145deg,
          rgba(235, 240, 255, 0.13),
          rgba(25, 26, 31, 0.16) 56%,
          rgba(255, 255, 255, 0.065)
        );
        backdrop-filter: blur(28px) saturate(1.1);
        -webkit-backdrop-filter: blur(28px) saturate(1.1);
        mask-image:
          linear-gradient(
            to right,
            transparent,
            black 15%,
            black 85%,
            transparent
          ),
          linear-gradient(
            to bottom,
            transparent,
            black 15%,
            black 85%,
            transparent
          );
        mask-composite: intersect;
        -webkit-mask-image:
          linear-gradient(
            to right,
            transparent,
            black 15%,
            black 85%,
            transparent
          ),
          linear-gradient(
            to bottom,
            transparent,
            black 15%,
            black 85%,
            transparent
          );
        -webkit-mask-composite: source-in;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: 26px;
        pointer-events: none;
        border: 1px solid rgba(235, 240, 255, 0.25);
        filter: blur(1.5px);
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          transform: none;
          transition: none;
        }
      }
      .avatar {
        width: 126px;
        height: 126px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.07);
      }
      .eyebrow {
        margin: 24px 0 8px;
        color: #d6d6d8;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 700;
      }
      h1 {
        font-size: clamp(28px, 7vw, 39px);
        line-height: 1.15;
        letter-spacing: -0.04em;
        overflow-wrap: anywhere;
        margin: 0 0 26px;
      }
      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.2);
        margin: 28px 0 22px;
      }
      .label {
        margin: 0 0 14px;
        font-size: 14px;
        color: #d3d4d8;
      }
      .socials {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .social {
        width: 58px;
        height: 58px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
        display: grid;
        place-items: center;
        border-radius: 10px;
        text-decoration: none;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .social:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }
      .social:active:not(.pending) {
        transform: scale(.94);
        background: rgba(220, 238, 255, .25);
      }
      .social:focus-visible,
      .music:focus-visible {
        outline: 3px solid #d8ddff;
        outline-offset: 3px;
      }
      .social.pending {
        opacity: 0.62;
        cursor: not-allowed;
      }
      .names {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 9px;
        color: #d6d6d8;
        font-size: 12px;
      }
      .names span {
        width: 58px;
      }
      .music {
        margin-top: 26px;
        min-height: 44px;
        border: 0;
        background: transparent;
        color: #dddfe3;
        font: inherit;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
      }
      .music svg {
        width: 15px;
        height: 15px;
      }
      .music[disabled] {
        opacity: 0.8;
        cursor: default;
      }
      .footer {
        position: fixed;
        bottom: 15px;
        right: 20px;
        color: #fff;
        font-size: 12px;
        text-shadow: 0 1px 3px #000;
      }
      .footer a {
        color: inherit;
      }
      @media (max-width: 500px) {
        .card {
          padding: 34px 22px 26px;
        }
        .avatar {
          width: 108px;
          height: 108px;
        }
        main {
          padding: 24px 16px 50px;
        }
        .footer {
          font-size: 11px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flake {
          animation: none;
          display: none;
        }
        .social {
          transition: none;
        }
      }
    </style>
  </head>
  <body>

    <div class="snow" aria-hidden="true" id="snow"></div>
    <main>

        <img src="avatar.jpg" class="avatar" alt="Аватарка The Phantom" draggable="false" />
        <p class="eyebrow">Личная страница</p>
        <h1 id="nickname">The_Phantom-_-</h1>
        <p class="label" id="status">Ссылки появятся здесь</p>
        <div class="socials" id="socials">

          <svg

    </main>
    <script src="config.js"></script>
    <script>
      const settings = typeof SITE === "object" ? SITE : {};
      const $ = (id) => document.getElementById(id);
      $("nickname").textContent = settings.nickname || "The_Phantom-_-";
      document.title = $("nickname").textContent;
      let count = 0;
      for (const id of ["steam", "discord", "server"]) {
        const el = $(id);
        let url;
        try {
          url = new URL(settings[id]);
          if (!["http:", "https:"].includes(url.protocol)) throw Error();
        } catch (e) {
          url = null;
        }
        if (url) {
          el.href = url.href;
          el.target = "_blank";
          el.rel = "noopener noreferrer";
          count++;
        } else {
          el.classList.add("pending");
          el.setAttribute("aria-disabled", "true");
          el.title = "Ссылка пока не добавлена";
        }
      }
      $("status").textContent =
        count === 3
          ? "Мои ссылки"
          : count
            ? "Не все ссылки пока добавлены"
            : "Ссылки появятся здесь";
      if (settings.music) {
        const button = $("music"),
          audio = $("audio");
        audio.src = settings.music;
        button.disabled = false;
        button.querySelector("span").textContent = "Включить музыку";
        button.addEventListener("click", async () => {
          if (audio.paused) {
            try {
              await audio.play();
              button.querySelector("span").textContent = "Остановить музыку";
            } catch (e) {
              button.querySelector("span").textContent =
                "Не удалось открыть файл";
            }
          } else {
            audio.pause();
            button.querySelector("span").textContent = "Включить музыку";
          }
        });
      }
      const glow = $("cursorGlow");
      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        let tx = -100,
          ty = -100,
          x = -100,
          y = -100,
          anim = false;
        function animateGlow() {
          x += (tx - x) * 0.24;
          y += (ty - y) * 0.24;
          glow.style.transform = `translate(${x - 3.5}px,${y - 3.5}px)`;
          if (Math.abs(tx - x) > 0.15 || Math.abs(ty - y) > 0.15) {
            requestAnimationFrame(animateGlow);
          } else {
            anim = false;
          }
        }
        window.addEventListener("pointermove", (e) => {
          if (x === -100) {
            x = e.clientX;
            y = e.clientY;
          }
          tx = e.clientX;
          ty = e.clientY;
          glow.style.opacity = "1";
          if (!anim) {
            anim = true;
            requestAnimationFrame(animateGlow);
          }
        });
        document.addEventListener("pointerleave", () => {
          glow.style.opacity = "0";
        });
      }
      const card = document.querySelector(".card");
      const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !motion.matches
      ) {
        card.addEventListener("pointermove", (e) => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          card.style.setProperty("--tilt-y", (x * 8).toFixed(2) + "deg");
          card.style.setProperty("--tilt-x", (-y * 8).toFixed(2) + "deg");
        });
        card.addEventListener("pointerleave", () => {
          card.style.setProperty("--tilt-y", "0deg");
          card.style.setProperty("--tilt-x", "0deg");
        });
      }
      const snow = $("snow");
      if (!motion.matches) {
        const amount = matchMedia("(max-width: 500px)").matches ? 65 : 115;
        for (let i = 0; i < amount; i++) {
          const f = document.createElement("i");
          const depth = Math.random();
          const size = 1.4 + depth * 4.4;
          f.className = "flake";
          f.style.setProperty("--left", (Math.random() * 100).toFixed(2) + "%");
          f.style.setProperty("--size", size.toFixed(1) + "px");
          f.style.setProperty("--opacity", (0.28 + depth * 0.52).toFixed(2));
          f.style.setProperty("--blur", (depth > 0.8 ? 1.05 : depth > 0.55 ? 0.35 : 0).toFixed(1) + "px");
          f.style.setProperty("--glow", (1 + depth * 4).toFixed(1) + "px");
          f.style.setProperty("--duration", (11 + (1 - depth) * 17 + Math.random() * 7).toFixed(1) + "s");
          f.style.setProperty("--delay", (-Math.random() * 45).toFixed(1) + "s");
          f.style.setProperty("--sway-duration", (2.8 + Math.random() * 4.2).toFixed(1) + "s");
          f.style.setProperty("--sway", (8 + depth * 13 + Math.random() * 8).toFixed(1) + "px");
          f.style.setProperty("--drift", (-35 + Math.random() * 115).toFixed(1) + "px");
          snow.appendChild(f);
        }
        document.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || motion.matches) return;
          const spark = document.createElement("i");
          spark.className = "click-spark";
          spark.setAttribute("aria-hidden", "true");
          spark.style.setProperty("--x", event.clientX + "px");
          spark.style.setProperty("--y", event.clientY + "px");
          const count = 12;
          for (let i = 0; i < count; i++) {
            const flake = document.createElement("i");
            const angle = (i / count) * Math.PI * 2 + (Math.random() - .5) * .32;
            const distance = 35 + Math.random() * 50;
            flake.className = "ice-particle";
            flake.style.setProperty("--dx", (Math.cos(angle) * distance).toFixed(1) + "px");
            flake.style.setProperty("--dy", (Math.sin(angle) * distance + 12).toFixed(1) + "px");
            flake.style.setProperty("--size", (2 + Math.random() * 3.5).toFixed(1) + "px");
            flake.style.setProperty("--round", i % 3 ? "50%" : "1px");
            flake.style.setProperty("--spin", (Math.random() * 180).toFixed(0) + "deg");
            flake.style.setProperty("--life", (650 + Math.random() * 300).toFixed(0) + "ms");
            spark.appendChild(flake);
          }
          document.body.appendChild(spark);
          setTimeout(() => spark.remove(), 1100);
        });
      }

    </script>
  </body>
</html>
