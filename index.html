const settings=typeof SITE==='object'?SITE:{};const $=id=>document.getElementById(id);$('nickname').textContent=settings.nickname||'The_Phantom-_-';document.title=$('nickname').textContent;let count=0;for(const id of ['steam','discord','server']){const el=$(id);let url;try{url=new URL(settings[id]);if(!['http:','https:'].includes(url.protocol))throw Error()}catch(e){url=null}if(url){el.href=url.href;el.target='_blank';el.rel='noopener noreferrer';count++}else{el.classList.add('pending');el.setAttribute('aria-disabled','true');el.title='Ссылка пока не добавлена'}}$('status').textContent=count===3?'Мои ссылки':count?'Не все ссылки пока добавлены':'Ссылки появятся здесь';if(settings.music){const button=$('music'),audio=$('audio');audio.src=settings.music;button.disabled=false;button.querySelector('span').textContent='Включить музыку';button.addEventListener('click',async()=>{if(audio.paused){try{await audio.play();button.querySelector('span').textContent='Остановить музыку'}catch(e){button.querySelector('span').textContent='Не удалось открыть файл'}}else{audio.pause();button.querySelector('span').textContent='Включить музыку'}})}const glow=$('cursorGlow');if(window.matchMedia('(hover: hover) and (pointer: fine)').matches&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){let tx=-100,ty=-100,x=-100,y=-100,anim=false;function animateGlow(){x+=(tx-x)*.24;y+=(ty-y)*.24;glow.style.transform=`translate(${x-3.5}px,${y-3.5}px)`;if(Math.abs(tx-x)>.15||Math.abs(ty-y)>.15){requestAnimationFrame(animateGlow)}else{anim=false}}window.addEventListener('pointermove',e=>{if(x===-100){x=e.clientX;y=e.clientY}tx=e.clientX;ty=e.clientY;glow.style.opacity='1';if(!anim){anim=true;requestAnimationFrame(animateGlow)}});document.addEventListener('pointerleave',()=>{glow.style.opacity='0'})}const card=document.querySelector('.card');const motion=window.matchMedia('(prefers-reduced-motion: reduce)');if(window.matchMedia('(hover: hover) and (pointer: fine)').matches&&!motion.matches){card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;card.style.setProperty('--tilt-y',(x*8).toFixed(2)+'deg');card.style.setProperty('--tilt-x',(-y*8).toFixed(2)+'deg')});card.addEventListener('pointerleave',()=>{card.style.setProperty('--tilt-y','0deg');card.style.setProperty('--tilt-x','0deg')})}const snow=$('snow');for(let i=0;i<30;i++){const f=document.createElement('i');f.className='flake';f.style.setProperty('--left',(Math.random()*100)+'%');f.style.setProperty('--duration',(8+Math.random()*12)+'s');f.style.setProperty('--delay',(-Math.random()*20)+'s');snow.appendChild(f)}
</script></body></html>
