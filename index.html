<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101112" />
    <title>The_Phantom-_-</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        min-height: 100vh;
        min-height: 100svh;
        color: #f5f5f4;
        font:
          16px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        background:
          linear-gradient(rgba(5, 7, 9, 0.34), rgba(5, 7, 9, 0.53)),
          url("fon.jpg") center/cover fixed;
      }
      .cursor-glow {
        position: fixed;
        left: 0;
        top: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(245, 249, 255, 0.95);
        box-shadow:
          0 0 7px 2px rgba(225, 237, 255, 0.8),
          0 0 24px 8px rgba(194, 216, 255, 0.35),
          0 0 46px 15px rgba(165, 194, 255, 0.12);
        pointer-events: none;
        z-index: 20;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: opacity 0.25s ease;
      }
      @media (hover: none),
        (pointer: coarse),
        (prefers-reduced-motion: reduce) {
        .cursor-glow {
          display: none;
        }
      }
      .mist {
        position: fixed;
        z-index: 0;
        inset: 20% -25% -10%;
        pointer-events: none;
        overflow: hidden;
        opacity: .42;
        mask-image: linear-gradient(transparent 2%, #000 45%, #000 85%, transparent);
      }
      .mist::before, .mist::after {
        content: "";
        position: absolute;
        inset: 20% -15% 0;
        background: radial-gradient(ellipse 30% 11% at 22% 60%, rgba(185,205,224,.22), transparent 75%), radial-gradient(ellipse 34% 13% at 70% 78%, rgba(190,209,227,.18), transparent 75%), radial-gradient(ellipse 28% 10% at 57% 43%, rgba(205,219,230,.11), transparent 75%);
        filter: blur(25px);
        animation: mist-drift 32s ease-in-out infinite alternate;
      }
      .mist::after { opacity: .65; transform: scaleX(-1); animation-duration: 43s; animation-direction: alternate-reverse; }
      @keyframes mist-drift { from { translate: -3% 0; } to { translate: 4% -8px; } }
      .cursor-flake {
        position: fixed;
        z-index: 19;
        pointer-events: none;
        left: var(--x); top: var(--y);
        width: var(--size); height: var(--size);
        border-radius: 50%;
        background: #edf8ff;
        box-shadow: 0 0 8px 2px rgba(181, 220, 255, .42);
        animation: trail-fade 950ms ease-out forwards;
      }
      @keyframes trail-fade {
        from { opacity: .75; transform: translate(-50%,-50%) scale(1); }
        to { opacity: 0; transform: translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15); }
      }
      .snow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .flake {
        position: absolute;
        top: -16px;
        left: var(--left);
        width: var(--size);
        height: var(--size);
        opacity: var(--opacity);
        animation: snowfall var(--duration) linear var(--delay) infinite;
        will-change: transform;
      }
      .flake::before {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #f5f9ff;
        box-shadow: 0 0 var(--glow) rgba(219, 236, 255, 0.65);
        filter: blur(var(--blur));
        animation: snow-sway var(--sway-duration) ease-in-out var(--delay) infinite alternate;
      }
      @keyframes snowfall {
        from { transform: translate3d(0, -12px, 0); }
        to { transform: translate3d(var(--drift), calc(100svh + 30px), 0); }
      }
      @keyframes snow-sway {
        from { transform: translateX(calc(var(--sway) * -1)) scale(.85); }
        to { transform: translateX(var(--sway)) scale(1.12); }
      }
      .demo-effect { position:fixed; left:var(--x); top:var(--y); width:0; height:0; pointer-events:none; z-index:35; }
      .demo-effect::before,.demo-effect::after { content:""; position:absolute; pointer-events:none; }
      .demo-particle { position:absolute; left:0; top:0; width:var(--size); height:var(--size); background:#a6d7ff; border-radius:50%; box-shadow:0 0 8px #a6d7ff; animation:vortex-dust var(--life) ease-out forwards; }
      .demo-effect::before {
        left:-44px; top:-44px; width:88px; height:88px;
        border:3px solid transparent; border-top-color:rgba(240,252,255,.95); border-right-color:rgba(155,217,255,.75); border-radius:50%;
        filter:drop-shadow(0 0 8px rgba(147,215,255,.85)); animation:demo-swirl 1.15s cubic-bezier(.12,.55,.25,1) forwards;
      }
      .demo-effect::after {
        left:-30px; top:-30px; width:60px; height:60px;
        border:2px solid transparent; border-bottom-color:#f4fdff; border-left-color:#a5e0ff; border-radius:50%;
        filter:drop-shadow(0 0 5px #a8e5ff); animation:demo-swirl-inner 1.05s ease-out forwards;
      }
      @keyframes demo-swirl { from {opacity:1;transform:scale(.15) rotate(0)} to {opacity:0;transform:scale(2) rotate(300deg)} }
      @keyframes demo-swirl-inner { 0% {opacity:1;transform:scale(.15) rotate(0deg)} 100% {opacity:0;transform:scale(1.7) rotate(-280deg)} }
      @keyframes vortex-dust {
        0% { opacity:1; transform:translate(-50%,-50%) scale(.2); }
        45% { opacity:1; transform:translate(calc(var(--midx) - 50%),calc(var(--midy) - 50%)) scale(1); }
        100% { opacity:0; transform:translate(calc(var(--dx) - 50%),calc(var(--dy) - 50%)) scale(.3); }
      }
      main {
        overflow-x: clip;
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }
      .card {
        width: min(100%, 460px);
        padding: 40px 32px 32px;
        text-align: center;
        background: linear-gradient(145deg, rgba(224, 238, 249, .05) 0%, rgba(121, 148, 171, .018) 38%, rgba(19, 28, 37, .055) 74%, rgba(189, 213, 232, .035) 100%);
        border: 1px solid rgba(220, 235, 248, .09);
        border-radius: 28px;
        backdrop-filter: blur(15px) saturate(1.08);
        -webkit-backdrop-filter: blur(15px) saturate(1.08);
        box-shadow: inset 1px 1px 3px rgba(238, 248, 255, .14), inset -1px -2px 4px rgba(192, 218, 238, .08), 0 14px 32px rgba(0, 0, 0, .16), 0 3px 9px rgba(0, 0, 0, .12);
      }
      .card {
        position: relative;
        isolation: isolate;
        transform: perspective(1100px) rotateX(var(--tilt-x, 0deg))
          rotateY(var(--tilt-y, 0deg));
        transition: transform 0.18s ease-out;
        animation: card-entrance 950ms cubic-bezier(.16, 1, .3, 1) both;
      }
      @keyframes card-entrance {
        from { opacity: 0; translate: 0 22px; }
        to { opacity: 1; translate: 0 0; }
      }
      .card::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 30px;
        pointer-events: none;
        border: 1px solid rgba(220, 237, 249, .20);
        box-shadow: 0 0 7px rgba(182, 212, 235, .09), inset 0 0 6px rgba(220, 237, 249, .08);
        filter: blur(2.5px);
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          transform: none;
          transition: none;
          animation: none;
        }
      }
      .avatar {
        width: 126px;
        height: 126px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.07);
      }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .avatar { transition: box-shadow .35s ease, border-color .35s ease, filter .35s ease; }
        .avatar:hover {
          border-color: rgba(235, 248, 255, .94);
          box-shadow: 0 0 0 6px rgba(203,228,255,.12), 0 0 18px rgba(179, 221, 255, .38), 0 0 42px rgba(156, 201, 255, .18);
          filter: brightness(1.1);
        }
      }
      .eyebrow {
        margin: 24px 0 8px;
        color: #d6d6d8;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 700;
      }
      h1 {
        font-size: clamp(28px, 7vw, 39px);
        line-height: 1.15;
        letter-spacing: -0.04em;
        overflow-wrap: anywhere;
        margin: 0 0 26px;
      }
      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.2);
        margin: 28px 0 22px;
      }
      .label {
        margin: 0 0 14px;
        font-size: 14px;
        color: #d3d4d8;
      }
      .socials {
        width: min(100%, 360px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
        justify-items: center;
      }
      .social {
        width: 58px;
        height: 58px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
        display: grid;
        place-items: center;
        border-radius: 10px;
        text-decoration: none;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .social:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }
      .social:active:not(.pending) {
        transform: scale(.94);
        background: rgba(220, 238, 255, .25);
      }
      .social:focus-visible,
      .music:focus-visible {
        outline: 3px solid #d8ddff;
        outline-offset: 3px;
      }
      .social.pending {
        opacity: 0.62;
        cursor: not-allowed;
      }
      .names {
        width: min(100%, 360px);
        margin: 9px auto 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
        color: #e3e8ef;
        font-size: 12px;
      }
      .names > span { min-width: 0; }
      .names small {
        display: block;
        color: #d1d8e1;
        font-size: 11px;
        line-height: 1.4;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .player {
        width: min(100%, 345px);
        margin: 25px auto 0;
        padding: 13px 14px 9px;
        border: 1px solid rgba(221, 239, 255, .08);
        border-radius: 14px;
        background: rgba(12, 16, 21, .12);
        text-align: left;
      }
      .player-top { display: flex; align-items: center; gap: 10px; }
      .album-art { width: 46px; height: 46px; flex: 0 0 46px; border-radius: 7px; object-fit: cover; border: 1px solid rgba(255,255,255,.18); }
      .track-info { flex: 1; min-width: 0; }
      .track-name { display: block; color: #fff; font-size: 13px; font-weight: 650; line-height: 1.3; }
      .track-artist { display: block; margin-top: 3px; color: #d1d9e2; font-size: 12px; line-height: 1.3; }
      .volume-toggle, .music {
        width: 40px; height: 44px; flex: 0 0 40px; padding: 0;
        display: grid; place-items: center;
        border: 0; border-radius: 10px;
        background: transparent; color: #e9f5ff; cursor: pointer;
        transition: background .2s, transform .2s;
      }
      .music { width: 44px; flex-basis: 44px; border: 1px solid rgba(224,241,255,.25); border-radius: 50%; background: rgba(220,239,255,.06); font: 14px/1 system-ui,sans-serif; }
      .volume-toggle:hover, .volume-toggle[aria-expanded="true"], .music:hover { background: rgba(220,239,255,.18); }
      .music:active { transform: scale(.94); }
      .music[disabled] { opacity: .5; cursor: default; }
      .volume-toggle svg { width: 19px; height: 19px; }
      .volume-toggle:focus-visible, .music:focus-visible { outline: 3px solid #d8ddff; outline-offset: 3px; }
      .seek-row { margin-top: 8px; display: flex; align-items: center; gap: 7px; color: #cbd7e1; font-size: 11px; font-variant-numeric: tabular-nums; }
      .seek-row time { width: 32px; flex: 0 0 32px; text-align: center; }
      .range-wrap { position:relative; display:flex; flex:1; min-width:0; align-items:center; }
      .range-wrap::before { content:""; position:absolute; left:0; top:50%; width:var(--progress, 0%); height:3px; transform:translateY(-50%); border-radius:5px; background:#d5efff; box-shadow:0 0 5px 2px rgba(174,223,255,.68), 0 0 13px 4px rgba(114,188,244,.38); opacity:var(--glow-opacity, 0); pointer-events:none; }
      .player input[type="range"] { position:relative; z-index:1; width:100%; flex: 1; min-width: 0; height: 32px; margin: 0; padding: 0; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; }
      .player input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 5px; background: linear-gradient(to right, #d5efff 0 var(--progress, 0%), rgba(213,232,245,.24) var(--progress, 0%) 100%); }
      .player input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance:none; width:10px; height:10px; margin-top:-3.5px; border:0; border-radius:50%; background:#f4fbff; box-shadow:0 0 6px rgba(205,238,255,.9), 0 0 14px rgba(139,201,255,.65); }
      .player input[type="range"]::-moz-range-track { height:3px; border-radius:5px; background:rgba(213,232,245,.25); }
      .player input[type="range"]::-moz-range-progress { height:3px; border-radius:5px; background:#d5efff; }
      .player input[type="range"]::-moz-range-thumb { width:10px; height:10px; border:0; border-radius:50%; background:#f4fbff; box-shadow:0 0 6px rgba(205,238,255,.9), 0 0 14px rgba(139,201,255,.65); }
      .player input[type="range"]:disabled { opacity:.55; cursor:default; }
      .player input[type="range"]:focus-visible { outline: 3px solid #d8ddff; outline-offset: 1px; }
      .volume-row { display:flex; align-items:center; gap:10px; color:#d9e5f0; font-size:12px; }
      .volume-row[hidden] { display:none; }
      .music-status { margin: 6px 0 0; color: #ffe0df; font-size: 12px; line-height: 1.35; }
      .music-status:empty { display: none; }
      .footer {
        position: fixed;
        bottom: 15px;
        right: 20px;
        color: #fff;
        font-size: 12px;
        text-shadow: 0 1px 3px #000;
      }
      .footer a {
        color: inherit;
      }
      @media (max-width: 500px) {
        .card {
          padding: 34px 22px 26px;
        }
        .avatar {
          width: 108px;
          height: 108px;
        }
        main {
          padding: 24px 16px 50px;
        }
        .footer {
          font-size: 11px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mist::before, .mist::after { animation: none; }
        .cursor-flake { display: none; }
        .flake {
          animation: none;
          display: none;
        }
        .social {
          transition: none;
        }
      }


      .intro-scene { position:fixed; inset:0; z-index:100; overflow:hidden; display:grid; place-items:center; background:linear-gradient(rgba(5, 7, 9, .40), rgba(5, 7, 9, .57)), url("fon.jpg") center / cover no-repeat; color:#f4fbff; opacity:1; transition:opacity .8s ease; }
      .intro-scene::before, .intro-scene::after { content:""; position:absolute; inset:-20%; pointer-events:none; background:radial-gradient(ellipse 38% 16% at 40% 64%, rgba(167,205,233,.08),transparent 72%),radial-gradient(ellipse 38% 14% at 76% 53%,rgba(139,180,216,.06),transparent 75%); filter:blur(32px); animation:intro-mist 5s ease-in-out infinite alternate; }
      .intro-scene::after { opacity:.6; animation-direction:alternate-reverse; animation-duration:7s; }
      @keyframes intro-mist {from{transform:translateX(-6%) scale(1)}to{transform:translateX(6%) scale(1.08)}}
      .intro-snow { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
      .intro-flake { position:absolute; top:-8px; left:var(--x); width:var(--s); height:var(--s); border-radius:50%; background:#e8f5ff; opacity:var(--o); box-shadow:0 0 10px rgba(190,226,255,.7); animation:intro-fall var(--t) linear var(--delay) infinite; }
      @keyframes intro-fall {from{transform:translate3d(0,-10px,0)}to{transform:translate3d(var(--drift),110vh,0)}}
      .intro-lockup { position:relative; z-index:1; padding:24px; text-align:center; animation:intro-lockup 3.9s ease both; }
      .intro-name { margin:0; font-size:clamp(26px, 5vw, 48px); font-weight:650; letter-spacing:.04em; line-height:1.15; text-shadow:0 0 28px rgba(163,212,255,.35); overflow-wrap:anywhere; }
      @keyframes intro-lockup { 0%{opacity:0;filter:blur(12px);transform:translateY(14px) scale(.97)} 30%,72%{opacity:1;filter:blur(0);transform:translateY(0) scale(1)} 100%{opacity:0;filter:blur(5px);transform:translateY(-8px) scale(1.025)} }
      .intro-scene.is-leaving {opacity:0;pointer-events:none}
      @media (prefers-reduced-motion:reduce) { .intro-scene {display:none} }

      /* Вариант 8: почти прозрачное стекло, компоновка вдохновлена шаблоном. */
      .card { width:min(100%, 600px); background:linear-gradient(140deg,rgba(227,240,249,.018),rgba(12,24,33,.025)); border:1px solid rgba(224,242,255,.05); backdrop-filter:blur(3px) saturate(1.08); -webkit-backdrop-filter:blur(3px) saturate(1.08); box-shadow:0 10px 32px rgba(0,0,0,.05); padding:26px 32px; }
      .card::after { inset:-2px; border:1px solid rgba(220,238,250,.075); box-shadow:0 0 10px rgba(220,238,250,.075); filter:blur(5px); }
      .profile-heading { display:flex; align-items:center; gap:24px; text-align:left; }
      .profile-heading-text { min-width:0; }
      .profile-heading .avatar { width:100px; height:100px; flex:0 0 100px; }
      .profile-heading .eyebrow { margin:0 0 10px; }
      .profile-heading h1 { font-size:clamp(25px,4vw,36px); margin:0; letter-spacing:-.03em; text-shadow:0 0 20px rgba(182,222,255,.25); }
      .player { width:100%; margin:18px 0 0; padding:14px 16px 10px; }
      .label { margin:22px 0 8px; }
      .socials, .names { width:min(100%,360px); }
      .socials { margin:12px auto 0; }
      .names { margin:0 auto; }
      .social { background:transparent; border-color:transparent; }
      .social svg { filter:drop-shadow(0 0 7px rgba(190,228,255,.35)); }
      .social:hover { background:rgba(220,239,255,.10); }
      @media (max-width:500px) {
        .card { padding:22px 20px 20px; }
        .profile-heading { gap:16px; }
        .profile-heading .avatar { width:76px; height:76px; flex-basis:76px; }
        .profile-heading .eyebrow { font-size:10px; letter-spacing:.16em; margin-bottom:8px; }
        .profile-heading h1 { font-size:clamp(20px,6vw,28px); }
        .player { margin-top:17px; }
      }
    </style>
  </head>
  <body>
    <div class="intro-scene" id="intro-scene" aria-hidden="true">
      <div class="intro-snow" id="intro-snow" aria-hidden="true"></div>
      <div class="intro-lockup"><p class="intro-name">The_Phantom-_-</p></div>
    </div>
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
    <div class="snow" aria-hidden="true" id="snow"></div>
    <main>
      <section class="card" aria-label="Личная визитка">
        <div class="profile-heading">
          <img src="avatar.jpg" class="avatar" alt="Аватарка The Phantom" draggable="false" />
          <div class="profile-heading-text">
            <p class="eyebrow">Личная страница</p>
            <h1 id="nickname">The_Phantom-_-</h1>
          </div>
        </div>
        <section class="player" aria-label="Музыкальный плеер">
          <div class="player-top">
            <img class="album-art" src="cover.webp" alt="Обложка трека No, the moon" draggable="false" />
            <div class="track-info">
              <span class="track-name">No, the moon</span>
              <span class="track-artist">deadflowers</span>
            </div>
            <button class="volume-toggle" id="volume-toggle" type="button" aria-label="Настроить громкость" aria-controls="volume-panel" aria-expanded="false" title="Громкость"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
            <button class="music" id="music" type="button" aria-label="Включить музыку" title="Включить музыку" disabled><span aria-hidden="true">▶</span></button>
          </div>
          <div class="seek-row">
            <time id="elapsed">0:00</time>
            <div class="range-wrap"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Перемотка трека" aria-valuetext="0:00" disabled /></div>
            <time id="duration">--:--</time>
          </div>
          <div class="volume-row" id="volume-panel" hidden>
            <label for="volume">Громкость</label>
            <div class="range-wrap"><input id="volume" type="range" min="0" max="100" value="35" aria-label="Громкость музыки" /></div>
          </div>
          <p class="music-status" id="music-status" role="status"></p>
          <audio id="audio" loop preload="metadata"></audio>
        </section>
        <div class="socials" id="socials">
          <a class="social" id="steam" aria-label="Steam: The_Phantom-_-"
            ><svg
              stroke="currentColor"
              fill="currentColor"
              stroke-width="0"
              viewBox="0 0 496 512"
              aria-hidden="true"
              height="23"
              width="23"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path

    <script src="config.js"></script>
    <script>
      const settings = typeof SITE === "object" ? SITE : {};
      const $ = (id) => document.getElementById(id);
      $("nickname").textContent = settings.nickname || "The_Phantom-_-";
      document.title = $("nickname").textContent;
      let count = 0;
      for (const id of ["steam", "discord", "server"]) {
        const el = $(id);
        let url;
        try {
          url = new URL(settings[id]);
          if (!["http:", "https:"].includes(url.protocol)) throw Error();
        } catch (e) {
          url = null;
        }
        if (url) {
          el.href = url.href;
          el.target = "_blank";
          el.rel = "noopener noreferrer";
          count++;
        } else {
          el.classList.add("pending");
          el.setAttribute("aria-disabled", "true");
          el.title = "Ссылка пока не добавлена";
        }
      }
      const musicButton = $("music"), audio = $("audio"), volume = $("volume"), musicStatus = $("music-status");
      const seek = $("seek"), elapsed = $("elapsed"), duration = $("duration");
      const volumeToggle = $("volume-toggle"), volumePanel = $("volume-panel");
      volumeToggle.addEventListener("click", () => {
        volumePanel.hidden = !volumePanel.hidden;
        volumeToggle.setAttribute("aria-expanded", String(!volumePanel.hidden));
      });
      function setRangeGlow(input, percent) { input.style.setProperty("--progress", percent + "%"); input.parentElement.style.setProperty("--progress", percent + "%"); input.parentElement.style.setProperty("--glow-opacity", percent > 0 ? "1" : "0"); }
      function updateVolumeFill() { setRangeGlow(volume, Number(volume.value)); }
      updateVolumeFill();
      volume.addEventListener("input", updateVolumeFill);
      function formatTime(value) {
        if (!Number.isFinite(value) || value < 0) return "--:--";
        const seconds = Math.floor(value);
        const minutes = Math.floor(seconds / 60);
        return minutes + ":" + String(seconds % 60).padStart(2, "0");
      }
      function updateTimeline() {
        const ready = Number.isFinite(audio.duration) && audio.duration > 0;
        seek.disabled = !ready;
        elapsed.textContent = formatTime(audio.currentTime);
        duration.textContent = formatTime(audio.duration);
        seek.value = ready ? Math.round(audio.currentTime / audio.duration * 1000) : 0;
        setRangeGlow(seek, Number(seek.value) / 10);
        seek.setAttribute("aria-valuetext", ready ? `${formatTime(audio.currentTime)} из ${formatTime(audio.duration)}` : "Длительность недоступна");
      }
      audio.addEventListener("loadedmetadata", updateTimeline);
      audio.addEventListener("durationchange", updateTimeline);
      audio.addEventListener("timeupdate", updateTimeline);
      audio.addEventListener("emptied", updateTimeline);
      seek.addEventListener("input", () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = Number(seek.value) / 1000 * audio.duration;
          updateTimeline();
        }
      });
      audio.volume = Number(volume.value) / 100;
      volume.addEventListener("input", () => { audio.volume = Number(volume.value) / 100; });
      function updateMusicButton() {
        const playing = !audio.paused;
        musicButton.querySelector("span").textContent = playing ? "❚❚" : "▶";
        const label = playing ? "Поставить музыку на паузу" : "Включить музыку";
        musicButton.setAttribute("aria-label", label);
        musicButton.title = label;
      }
      audio.addEventListener("play", updateMusicButton);
      audio.addEventListener("pause", updateMusicButton);
      if (settings.music) {
        audio.src = settings.music;
        musicButton.disabled = false;
        musicButton.addEventListener("click", async () => {
          musicStatus.textContent = "";
          if (audio.paused) {
            try { await audio.play(); }
            catch (e) { musicStatus.textContent = "Не удалось включить музыку. Попробуйте ещё раз."; }
          } else { audio.pause(); }
        });
      } else {
        musicStatus.textContent = "Музыка пока не добавлена.";
        volume.disabled = true;
      }
      const glow = $("cursorGlow");
      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        let tx = -100,
          ty = -100,
          x = -100,
          y = -100,
          anim = false;
        function animateGlow() {
          x += (tx - x) * 0.24;
          y += (ty - y) * 0.24;
          glow.style.transform = `translate(${x - 3.5}px,${y - 3.5}px)`;
          if (Math.abs(tx - x) > 0.15 || Math.abs(ty - y) > 0.15) {
            requestAnimationFrame(animateGlow);
          } else {
            anim = false;
          }
        }
        window.addEventListener("pointermove", (e) => {
          if (x === -100) {
            x = e.clientX;
            y = e.clientY;
          }
          tx = e.clientX;
          ty = e.clientY;
          glow.style.opacity = "1";
          if (!anim) {
            anim = true;
            requestAnimationFrame(animateGlow);
          }
        });
        document.addEventListener("pointerleave", () => {
          glow.style.opacity = "0";
        });
      }
      const card = document.querySelector(".card");
      const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !motion.matches
      ) {
        card.addEventListener("pointermove", (e) => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          card.style.setProperty("--tilt-y", (x * 8).toFixed(2) + "deg");
          card.style.setProperty("--tilt-x", (-y * 8).toFixed(2) + "deg");
        });
        card.addEventListener("pointerleave", () => {
          card.style.setProperty("--tilt-y", "0deg");
          card.style.setProperty("--tilt-x", "0deg");
        });
      }
      if (matchMedia("(hover: hover) and (pointer: fine)").matches && !motion.matches) {
        let trailAt = 0, lastX = -100, lastY = -100;
        document.addEventListener("pointermove", (event) => {
          if (motion.matches || event.pointerType === "touch") return;
          const now = performance.now();
          if (now - trailAt < 70 || Math.hypot(event.clientX - lastX, event.clientY - lastY) < 8) return;
          trailAt = now; lastX = event.clientX; lastY = event.clientY;
          const flake = document.createElement("i");
          flake.className = "cursor-flake";
          flake.setAttribute("aria-hidden", "true");
          flake.style.setProperty("--x", event.clientX + "px");
          flake.style.setProperty("--y", event.clientY + "px");
          flake.style.setProperty("--size", (2 + Math.random() * 2.5).toFixed(1) + "px");
          flake.style.setProperty("--dx", (-10 + Math.random() * 20).toFixed(0) + "px");
          flake.style.setProperty("--dy", (10 + Math.random() * 20).toFixed(0) + "px");
          document.body.appendChild(flake);
          setTimeout(() => flake.remove(), 1000);
        });
      }
      const snow = $("snow");
      if (!motion.matches) {
        const amount = matchMedia("(max-width: 500px)").matches ? 65 : 115;
        for (let i = 0; i < amount; i++) {
          const f = document.createElement("i");
          const depth = Math.random();
          const size = 1.4 + depth * 4.4;
          f.className = "flake";
          f.style.setProperty("--left", (Math.random() * 100).toFixed(2) + "%");
          f.style.setProperty("--size", size.toFixed(1) + "px");
          f.style.setProperty("--opacity", (0.28 + depth * 0.52).toFixed(2));
          f.style.setProperty("--blur", (depth > 0.8 ? 1.05 : depth > 0.55 ? 0.35 : 0).toFixed(1) + "px");
          f.style.setProperty("--glow", (1 + depth * 4).toFixed(1) + "px");
          f.style.setProperty("--duration", (11 + (1 - depth) * 17 + Math.random() * 7).toFixed(1) + "s");
          f.style.setProperty("--delay", (-Math.random() * 45).toFixed(1) + "s");
          f.style.setProperty("--sway-duration", (2.8 + Math.random() * 4.2).toFixed(1) + "s");
          f.style.setProperty("--sway", (8 + depth * 13 + Math.random() * 8).toFixed(1) + "px");
          f.style.setProperty("--drift", (-35 + Math.random() * 115).toFixed(1) + "px");
          snow.appendChild(f);
        }
        document.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || motion.matches) return;
          const effect = document.createElement("i");
          effect.className = "demo-effect";
          effect.setAttribute("aria-hidden", "true");
          effect.style.setProperty("--x", event.clientX + "px");
          effect.style.setProperty("--y", event.clientY + "px");
          const count = 16;
          for (let i = 0; i < count; i++) {
            const particle = document.createElement("i");
            const angle = i / count * Math.PI * 2 + (Math.random() - .5) * .3;
            const distance = 65 + Math.random() * 55;
            particle.className = "demo-particle";
            particle.style.setProperty("--midx", (Math.cos(angle - 1.15) * distance * .55).toFixed(1) + "px");
            particle.style.setProperty("--midy", (Math.sin(angle - 1.15) * distance * .55).toFixed(1) + "px");
            particle.style.setProperty("--dx", (Math.cos(angle) * distance).toFixed(1) + "px");
            particle.style.setProperty("--dy", (Math.sin(angle) * distance + 5).toFixed(1) + "px");
            particle.style.setProperty("--size", (2 + Math.random() * 3).toFixed(1) + "px");
            particle.style.setProperty("--life", (650 + Math.random() * 400).toFixed(0) + "ms");
            effect.appendChild(particle);
          }
          document.body.appendChild(effect);
          setTimeout(() => effect.remove(), 1250);
        });
      }

    </script>
    <script>
      (() => {
        const intro = document.getElementById("intro-scene"), main = document.querySelector("main");
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) { intro.remove(); return; }
        main.inert = true;
        const snow = document.getElementById("intro-snow");
        for (let i = 0; i < 38; i++) {
          const f = document.createElement("i"); f.className = "intro-flake";
          f.style.setProperty("--x", (Math.random() * 100).toFixed(1) + "%");
          f.style.setProperty("--s", (1 + Math.random() * 3).toFixed(1) + "px");
          f.style.setProperty("--o", (.2 + Math.random() * .55).toFixed(2));
          f.style.setProperty("--t", (9 + Math.random() * 13).toFixed(1) + "s");
          f.style.setProperty("--delay", (-Math.random() * 18).toFixed(1) + "s");
          f.style.setProperty("--drift", (15 + Math.random() * 70).toFixed(1) + "px"); snow.appendChild(f);
        }
        let closed = false;
        function closeIntro() {
          if (closed) return; closed = true; intro.classList.add("is-leaving");
          main.inert = false; setTimeout(() => intro.remove(), 850);
        }
        setTimeout(closeIntro, 4000);
      })();
    </script>
